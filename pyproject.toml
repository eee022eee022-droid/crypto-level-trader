[project]
name = "crypto-level-trader"
version = "0.1.0"
description = "Crypto trading agent that trades support/resistance levels on Gate futures. Paper-first, then live."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "ccxt>=4.4",
    "fastapi[standard]>=0.136.0",
    "jinja2>=3.1.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rich>=13.0",
    "uvicorn>=0.44.0",
]

[project.scripts]
level-trader = "level_trader.cli:main"
level-trader-web = "level_trader.web.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/level_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.15",
]
